<title>HVR Halloween Special</title>
<style>
  :root {
    --bg: #141414;
    --card: #222;

    --green: #7CFF4A;

  function joinNl(list) {

  function gearNotes(order) {
    const ids = [];
    order.forEach(function (g) {
      (g.gearIds || []).forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
    });
    const notes = [];
    ids.forEach(function (id) {
      let run = [];

        if (run.length >= 2) {
          const name = gearName(id);
          const verb = /(?:s|en)$/i.test(name) ? 'blijven' : 'blijft';
          notes.push(name + ' ' + verb + ' liggen bij ' + joinNl(run) + '.');
        }
        run = [];
      }
      order.forEach(function (g) {
        if ((g.gearIds || []).indexOf(id) >= 0) run.push(g.name);
        else flush();

      flush();
    });
    return notes;
  }
  let adviceCache = { sig: '', value: null };
  function orderAdvice() {
    const sig = S.games.map(function (g) { return g.id + '=' + g.participantType + ':' + (g.gearIds || []).join(','); }).join('|');
    if (adviceCache.sig === sig) return adviceCache.value;
    adviceCache = { sig: sig, value: computeAdvice() };
    return adviceCache.value;
  }
  function computeAdvice() {
    if (S.games.length < 2) return null;
    const solos = S.games.filter(function (g) { return g.participantType === 'solo'; });
    const groups = S.games.filter(function (g) { return g.participantType !== 'solo'; });
    if (!solos.length || !groups.length || solos.length > 12 || groups.length > 12) return null;
    const useCount = {};
    S.games.forEach(function (g) {
      (g.gearIds || []).forEach(function (id) { useCount[id] = (useCount[id] || 0) + 1; });
    });
    if (!Object.keys(useCount).some(function (id) { return useCount[id] >= 2; })) return null;
    const steps = solos.length + groups.length;
    function sideAt(step) {
      const pairs = Math.min(solos.length, groups.length);
      if (step < pairs * 2) return step % 2 === 0 ? 's' : 'g';
      return solos.length >= groups.length ? 's' : 'g';
    }
    function takeOut(prev, game) {
      let c = 0;
      (game.gearIds || []).forEach(function (id) {
        if (!prev || (prev.gearIds || []).indexOf(id) < 0) c += 1;
      });
      return c;
    }
    let layer = new Map();
    layer.set('0:0:', { cost: 0, game: null });
    const parents = [];
    for (let step = 0; step < steps; step++) {
      const side = sideAt(step);
      const list = side === 's' ? solos : groups;
      const next = new Map();
      const parent = new Map();
      layer.forEach(function (st, key) {
        const bits = key.split(':');
        const maskS = Number(bits[0]);
        const maskG = Number(bits[1]);
        for (let i = 0; i < list.length; i++) {
          const mask = side === 's' ? maskS : maskG;
          if (mask & (1 << i)) continue;
          const game = list[i];
          const c = st.cost + takeOut(st.game, game);
          const nS = side === 's' ? (maskS | (1 << i)) : maskS;
          const nG = side === 'g' ? (maskG | (1 << i)) : maskG;
          const nk = nS + ':' + nG + ':' + game.id;
          const old = next.get(nk);
          if (!old || c < old.cost) {
            next.set(nk, { cost: c, game: game });
            parent.set(nk, { prev: key, id: game.id });
          }
        }
      });
      if (!next.size) return null;
      parents.push(parent);
      layer = next;
    }
    let bestKey = null;
    let bestCost = Infinity;
    layer.forEach(function (st, key) {
      if (st.cost < bestCost) { bestCost = st.cost; bestKey = key; }
    });
    const ids = [];
    let key = bestKey;
    for (let step = steps - 1; step >= 0; step--) {
      const p = parents[step].get(key);
      if (!p) return null;
      ids.push(p.id);
      key = p.prev;
    }
    ids.reverse();
    const byId = {};
    S.games.forEach(function (g) { byId[g.id] = g; });
    const ordered = ids.map(function (id) { return byId[id]; }).filter(Boolean);
    const notes = gearNotes(ordered);
    if (!notes.length) return null;
    for (let i = 1; i < ordered.length; i++) {
      if (ordered[i].participantType === ordered[i - 1].participantType) {
        notes.push(ordered[i - 1].name + ' en ' + ordered[i].name + ' staan achter elkaar. Het aantal solo\'s en groepen laat dat niet anders.');
        break;
      }
    }
    const same = ordered.length === S.games.length && ordered.every(function (g, i) { return g.id === S.games[i].id; });
    return { ids: ids, games: ordered, notes: notes, same: same };
  }
  function applyAdvice() {
    if (!armed('advice')) return;

  function teamSoloLine(game, groupId) {

    ((g && g.playerIds) || []).forEach(function (pid) {
      const r = resultOf(game.id, pid);
      if (!r || r.status !== 'done') return;
      any = true;
      const p = Math.max(0, Number(r.points) || 0);

  function standLines(type, id) {

        lines.push(teamSoloLine(g, id));

      if (g.participantType !== type) return;
      if (g.skipped) { lines.push({ name: g.name, text: 'gaat niet door · telt niet mee' }); return; }

      const counted = countsOnStand(g);

        eq(writePodium(been, members, picks, steps), true, 'podium opgeslagen');
        eq(resultOf(been.id, picks[0]).points, 1, 'eerst gekozen is 3e');
        eq(resultOf(been.id, picks[1]).points, 2, 'daarna is 2e');
        eq(resultOf(been.id, picks[2]).points, 3, 'laatst gekozen is 1e');
        eq(resultOf(been.id, members[3]).points, 0, 'de rest niet aftikken');
        eq(gameComplete(been), true, 'been klaar');
      }
      const tellen = S.games.find(function (g) { return g.id === 'tellen'; });
      const tel = tellen ? roster(tellen) : [];
      if (tellen && tel.length >= 3) {
        const members = tel.map(function (p) { return p.id; });
        const steps = podiumSteps(members.length);
        eq(writePodium(tellen, members, [members[0], members[1], members[2]], steps), true, 'tellen podium');
        eq(resultOf(tellen.id, members[2]).points, 3, 'tellen 1e');
        eq(soloFeedsTeam(tellen), false, 'tellen niet naar team');
        eq(gameComplete(tellen), true, 'tellen klaar');
      }
    } finally {
      S.orders = JSON.parse(keepO);
      S.results = JSON.parse(keepR);
      S.modal = null;
      save();
    }
    return 'ok';
  }
  window.capyTest = selfTest;

  load();
  seedProgram();
  ensureGear();
  syncProgram();
  applySheetTeams();
  refreshSheetHints();
  S.view = bootView();
  if (!S.activeGameId && S.games[0]) S.activeGameId = S.games[0].id;
  render();
  syncTimer();
  trapBack();
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.update();
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
