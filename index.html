<title>HVR Halloween Special</title>
<style>
  :root {

  function joinNl(list) {
    if (list.length <= 1) return list.join('');

  function gearNotes(order) {
    const ids = [];
    order.forEach(function (g) {
      (g.gearIds || []).forEach(function (id) { if (ids.indexOf(id) < 0) ids.push(id); });
    });
    const notes = [];
    ids.forEach(function (id) {
      let run = [];
      function flush() {
        if (run.length >= 2) {
          const name = gearName(id);
          const verb = /(?:s|en)$/i.test(name) ? 'blijven' : 'blijft';
          notes.push(name + ' ' + verb + ' liggen bij ' + joinNl(run) + '.');
        }
        run = [];
      }
      order.forEach(function (g) {
        if ((g.gearIds || []).indexOf(id) >= 0) run.push(g.name);
        else flush();
      });
      flush();
    });
    return notes;
  }
  let adviceCache = { sig: '', value: null };
  function orderAdvice() {
    const sig = S.games.map(function (g) { return g.id + '=' + g.participantType + ':' + (g.gearIds || []).join(','); }).join('|');
    if (adviceCache.sig === sig) return adviceCache.value;
    adviceCache = { sig: sig, value: computeAdvice() };
    return adviceCache.value;
  }
  function computeAdvice() {
    if (S.games.length < 2) return null;
    const finale = S.games.find(function (g) { return g.id === 'koekoek'; }) || S.games.find(function (g) { return g.dark; }) || null;
    const pool = S.games.filter(function (g) { return !finale || g.id !== finale.id; });
    const solos = pool.filter(function (g) { return g.participantType === 'solo'; });
    const groups = pool.filter(function (g) { return g.participantType !== 'solo'; });
    if (!solos.length || !groups.length || solos.length > 12 || groups.length > 12) return null;
    const useCount = {};
    S.games.forEach(function (g) {
      (g.gearIds || []).forEach(function (id) { useCount[id] = (useCount[id] || 0) + 1; });
    });
    if (!Object.keys(useCount).some(function (id) { return useCount[id] >= 2; })) return null;
    const steps = solos.length + groups.length;
    function sideAt(step) {
      const pairs = Math.min(solos.length, groups.length);
      if (step < pairs * 2) return step % 2 === 0 ? 's' : 'g';
      return solos.length >= groups.length ? 's' : 'g';
    }
    function takeOut(prev, game) {
      let c = 0;
      (game.gearIds || []).forEach(function (id) {
        if (!prev || (prev.gearIds || []).indexOf(id) < 0) c += 1;
      });
      return c;
    }
    let layer = new Map();
    layer.set('0:0:', { cost: 0, game: null });
    const parents = [];
    for (let step = 0; step < steps; step++) {
      const side = sideAt(step);
      const list = side === 's' ? solos : groups;
      const next = new Map();
      const parent = new Map();
      layer.forEach(function (st, key) {
        const bits = key.split(':');
        const maskS = Number(bits[0]);
        const maskG = Number(bits[1]);
        for (let i = 0; i < list.length; i++) {
          const mask = side === 's' ? maskS : maskG;
          if (mask & (1 << i)) continue;
          const game = list[i];
          let c = st.cost + takeOut(st.game, game);
          if (finale && step === steps - 1) c += takeOut(game, finale);
          const nS = side === 's' ? (maskS | (1 << i)) : maskS;
          const nG = side === 'g' ? (maskG | (1 << i)) : maskG;
          const nk = nS + ':' + nG + ':' + game.id;
          const old = next.get(nk);
          if (!old || c < old.cost) {
            next.set(nk, { cost: c, game: game });
            parent.set(nk, { prev: key, id: game.id });
          }
        }
      });
      if (!next.size) return null;
      parents.push(parent);
      layer = next;
    }
    let bestKey = null;
    let bestCost = Infinity;
    layer.forEach(function (st, key) {
      if (st.cost < bestCost) { bestCost = st.cost; bestKey = key; }
    });
    const ids = [];
    let key = bestKey;
    for (let step = steps - 1; step >= 0; step--) {
      const p = parents[step].get(key);
      if (!p) return null;
      ids.push(p.id);
      key = p.prev;
    }
    ids.reverse();
    if (finale) ids.push(finale.id);
    const byId = {};
    S.games.forEach(function (g) { byId[g.id] = g; });
    const ordered = ids.map(function (id) { return byId[id]; }).filter(Boolean);
    const notes = gearNotes(ordered);
    if (!notes.length) return null;
    for (let i = 1; i < ordered.length; i++) {
      if (ordered[i].participantType === ordered[i - 1].participantType) {
        notes.push(ordered[i - 1].name + ' en ' + ordered[i].name + ' staan achter elkaar. Het aantal solo\'s en groepen laat dat niet anders. Koekoek blijft laatste, in het donker.');
        break;
      }
    }
    const same = ordered.length === S.games.length && ordered.every(function (g, i) { return g.id === S.games[i].id; });
    return { ids: ids, games: ordered, notes: notes, same: same };
  }
  function applyAdvice() {
    if (!armed('advice')) return;
    const adv = orderAdvice();
    if (!adv) return;
    const byId = {};
    S.games.forEach(function (g) { byId[g.id] = g; });
    const next = adv.ids.map(function (id) { return byId[id]; }).filter(Boolean);
    S.games.forEach(function (g) { if (next.indexOf(g) < 0) next.push(g); });

  function touchPrimary() {
    return (navigator.maxTouchPoints || 0) > 0 || window.matchMedia('(pointer: coarse)').matches;
  }
  function standaloneMode() {
    return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  }
  function fullscreenOn() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }
  function toggleFullscreen() {
    const el = document.documentElement;
    if (fullscreenOn()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen || document.webkitCancelFullScreen;
      if (exit) Promise.resolve(exit.call(document)).catch(function () {});
      return;
    }
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (!req) {
      flash('Op de iPad: tik Delen, dan Zet op beginscherm.');
      return;
    }
    Promise.resolve(req.call(el)).catch(function () {
      flash('Op de iPad: tik Delen, dan Zet op beginscherm.');
    });
  }
  function topBar() {
    const err = S.saveError ? '<p class="err">' + esc(S.saveError) + '</p>' : '';
    if (standaloneMode()) return '<div class="topbar"><span class="brand">HVR HALLOWEEN</span></div>' + err;
    const on = fullscreenOn();
    return '<div class="topbar"><span class="brand">HVR HALLOWEEN</span><button type="button" class="fs' + (on ? ' on' : '') + '" data-act="fullscreen">' + (on ? 'KLEINER' : 'VOLLEDIG') + '</button></div>' + err;
  }
  function servedFromThisPc() {
    const h = String(location.hostname || '');
    return h === 'localhost' || h === '127.0.0.1' || /^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[0-1])\.)/.test(h);
  }
  function showInstallTip() {
    if (standaloneMode()) return false;
    if (!touchPrimary()) return false;
    try { if (localStorage.getItem(KEY + '-tip') === '1') return false; } catch (e) {}
    return true;
  }
  function tipHtml() {
    if (!showInstallTip()) return '';
    const text = servedFromThisPc()
      ? 'Dit draait nu via de pc. Voor vrijdag zonder pc en zonder internet: open de link die je krijgt, tik Delen, dan Zet op beginscherm, en open dat icoon één keer met internet.'
      : 'Tik Delen, dan Zet op beginscherm. Open dat icoon één keer met internet. Daarna werkt hij zonder internet en zonder pc. Vul de namen in het icoon. Zet Automatisch slot op Nooit.';
    return '<div class="tip"><p>' + text + '</p><button class="pump" type="button" data-act="hide-tip">BEGREPEN</button></div>';
  }
  function applyFindFilter() {
    const q = (S.find || '').trim().toLowerCase();
    document.querySelectorAll('.col').forEach(function (col) {
      const people = col.querySelectorAll('.person');
      if (!people.length) return;
      let n = 0;
      people.forEach(function (btn) {
        const name = ((btn.querySelector('.nm') || {}).textContent || '') + ' ' + ((btn.querySelector('.sub') || {}).textContent || '');
        const ok = !q || name.toLowerCase().indexOf(q) >= 0;
        btn.hidden = !ok;
        if (ok) n += 1;
      });
      const empty = col.querySelector('.find-empty');
      if (empty) empty.hidden = n !== 0;
    });
  }
  function scrollNodes() {
    return document.querySelectorAll('.scroll, .play-side, .play-main, .sheet');
  }
  function render() {
    const saved = [];
    scrollNodes().forEach(function (n) { saved.push([n.className, n.scrollTop, n.scrollLeft]); });
    const map = { players: viewPlayers, groups: viewGroups, games: viewGames, backup: viewBackup, settings: viewSettings, stand: viewStand, action: viewAction };
    const fn = map[S.view] || viewAction;
    document.getElementById('app').innerHTML = topBar() + fn() + modalHtml();
    const next = scrollNodes();
    saved.forEach(function (row, i) {
      const n = next[i];
      if (!n || n.className !== row[0]) return;
      n.scrollTop = row[1];
      n.scrollLeft = row[2];
    });
    const name = document.getElementById('playerName');
    if (name && S.view === 'players' && !S.modal && !touchPrimary()) {
      name.focus();
      const v = name.value;
      name.setSelectionRange(v.length, v.length);
    }
    const typed = document.getElementById('scorePoints') || document.getElementById('scoreMin');
    if (typed && S.focusScore && !touchPrimary()) {
      S.focusScore = false;
      typed.focus();
      if (typed.select) typed.select();
    } else S.focusScore = false;
    const gearInp = document.getElementById('gearName');
    if (gearInp && S.focusGear && !touchPrimary()) {
      S.focusGear = false;
      gearInp.focus();
      const v = gearInp.value;
      gearInp.setSelectionRange(v.length, v.length);
    } else if (gearInp) S.focusGear = false;
    applyFindFilter();
  }

  function askDel(what, id) {
    let text = '';
    if (what === 'player') {
      const p = playerById(id);
      text = (p ? p.name : 'Deze speler') + ' gaat weg, mét solopscores. De groep blijft.';
    } else if (what === 'group') {
      const g = groupById(id);
      text = (g ? g.name : 'Deze groep') + ' gaat weg, mét groepsscores. De mensen komen bij Nog los.';
    } else if (what === 'gear') {
      const item = gearById(id);
      text = (item ? item.name : 'Dit') + ' gaat uit de lijst, en weg bij elk spel.';
    } else {
      const g = gameById(id);
      text = (g ? g.name : 'Dit spel') + ' gaat weg, mét alle scores van dit spel.';
    }
    S.modal = { kind: 'confirm-del', what: what, id: id, text: text };
    render();
  }
  function doDel() {
    const m = S.modal;
    if (!m || m.kind !== 'confirm-del') return;
    if (m.what === 'player') {
      const p = playerById(m.id);
      if (p) {
        const orders = {};
        Object.keys(S.orders).forEach(function (gid) {
          if ((S.orders[gid] || []).indexOf(p.id) >= 0) orders[gid] = S.orders[gid].slice();
        });
        pushUndo({
          kind: 'del-player',
          player: JSON.parse(JSON.stringify(p)),
          groups: S.groups.filter(function (g) { return g.playerIds.indexOf(p.id) >= 0; }).map(function (g) { return g.id; }),
          results: S.results.filter(function (r) {
            const g = gameById(r.gameId);
            return r.participantId === p.id && g && g.participantType === 'solo';
          }).map(function (r) { return JSON.parse(JSON.stringify(r)); }),
          orders: orders,
          label: p.name + ' is weggehaald. Tik om die persoon terug te zetten.'
        });
      }
      S.players = S.players.filter(function (p) { return p.id !== m.id; });
      S.groups.forEach(function (g) { g.playerIds = g.playerIds.filter(function (id) { return id !== m.id; }); });
      S.results = S.results.filter(function (r) {
        const g = gameById(r.gameId);
        return !(r.participantId === m.id && g && g.participantType === 'solo');
      });
      Object.keys(S.orders).forEach(function (gid) {
        S.orders[gid] = (S.orders[gid] || []).filter(function (id) { return id !== m.id; });
      });
    } else if (m.what === 'group') {
      const g = groupById(m.id);
      if (g) {
        pushUndo({
          kind: 'del-group',
          group: JSON.parse(JSON.stringify(g)),
          results: S.results.filter(function (r) { return r.participantId === g.id; }).map(function (r) { return JSON.parse(JSON.stringify(r)); }),
          label: g.name + ' is weg. Tik om de groep terug te zetten.'
        });
      }
      S.groups = S.groups.filter(function (x) { return x.id !== m.id; });
      S.results = S.results.filter(function (r) { return r.participantId !== m.id; });
      S.groupTarget = Math.max(1, S.groups.length || S.groupTarget);
    } else if (m.what === 'gear') {
      S.gear = S.gear.filter(function (g) { return g.id !== m.id; });
      S.games.forEach(function (g) { g.gearIds = (g.gearIds || []).filter(function (id) { return id !== m.id; }); });
    } else if (m.what === 'game') {
      S.games = S.games.filter(function (g) { return g.id !== m.id; });
      S.results = S.results.filter(function (r) { return r.gameId !== m.id; });
      delete S.watches[m.id];
      S.games.forEach(function (g, i) { g.order = i; });
      if (S.activeGameId === m.id) S.activeGameId = S.games[0] ? S.games[0].id : null;
    }
    S.modal = null;
    save();
    flash('GEWIST');
  }

  function onClick(e) {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    if (t.dataset.stop) return;
    const act = t.dataset.act;
    if (act === 'close-modal') {
      if (e.target.closest('[data-stop]') && e.target !== t && !t.classList.contains('modal-back') && act === 'close-modal' && t.dataset.act === 'close-modal') {
        /* button inside sheet */
      }
      if (e.currentTarget && t.classList.contains('modal-back') && e.target !== t) return;
      S.modal = null;
      S.score = null;
      if (S.arm === 'score-check' || S.arm === 'absent-check') { S.arm = null; S.armNote = ''; }
      render();
      return;
    }
    if (t.closest('.sheet') && e.target.classList.contains('modal-back')) return;
    if (act === 'hide-tip') {
      try { localStorage.setItem(KEY + '-tip', '1'); } catch (err) {}
      render();
      return;
    }
    if (act === 'add-player') { addPlayer(); return; }
    if (act === 'add-list') { addNameList(); return; }
    if (act === 'goto' || act === 'goto-free') { gotoView(t.dataset.view, act === 'goto-free'); return; }
    if (act === 'target') { S.groupTarget = clamp((Number(S.groupTarget) || 1) + Number(t.dataset.delta), 1, 12); S.arm = null; save(); render(); return; }
    if (act === 'deal') { deal(false); return; }
    if (act === 'deal-confirm') { deal(true); return; }
    if (act === 'add-group') { addGroup(); return; }
    if (act === 'move-here') { if (S.selectedPlayerId) movePlayer(S.selectedPlayerId, t.dataset.gid); return; }
    if (act === 'start-rename') {
      const g = groupById(t.dataset.id);
      S.renameGroupId = t.dataset.id;
      S.renameText = g ? g.name : '';
      render();
      const inp = document.getElementById('renameInput');
      if (inp) inp.focus();
      return;
    }
    if (act === 'save-rename') {
      const g = groupById(t.dataset.id);
      const name = (S.renameText || '').trim();
      if (g && name && name !== g.name) {
        pushUndo({ kind: 'rename', what: 'group', id: g.id, prev: g.name, label: 'De groep heet nu ' + name + '. Tik om ' + g.name + ' terug te zetten.' });
        g.name = name;
      }
      S.renameGroupId = null;
      save();
      render();
      return;
    }
    if (act === 'ask-del') { askDel(t.dataset.what, t.dataset.id); return; }
    if (act === 'do-del') { doDel(); return; }
    if (act === 'new-game') { S.gameForm = blankForm(); render(); return; }
    if (act === 'cancel-game') { S.gameForm = null; render(); return; }
    if (act === 'edit-game') { const g = gameById(t.dataset.id); if (g) { S.gameForm = editForm(g); render(); } return; }
    if (act === 'form-set') {
      const f = S.gameForm;
      if (!f) return;
      const key = t.dataset.key;
      let val = t.dataset.val;
      if (key === 'stopwatch') val = val === '1';
      f[key] = val;
      if (key === 'scoreType' && val === 'time') f.sort = 'low';
      if (key === 'scoreType' && val === 'points') f.sort = 'high';
      if (key === 'stopwatch' && val && !Number(f.signalM) && !Number(f.signalS)) { f.signalM = 1; f.signalS = 30; }
      render();
      return;
    }
    if (act === 'form-step') {
      const f = S.gameForm;
      if (!f) return;
      const field = t.dataset.field;
      const max = field === 'signalS' ? 59 : 180;
      f[field] = clamp((Number(f[field]) || 0) + Number(t.dataset.delta), 0, max);
      render();
      return;
    }
    if (act === 'form-nosein') { S.gameForm.signalM = 0; S.gameForm.signalS = 0; render(); return; }
    if (act === 'save-game') { saveGameForm(); return; }
    if (act === 'clear-try') { clearTryNames(); return; }
    if (act === 'gear-open') {
      S.gearOpen = S.gearOpen === t.dataset.id ? null : t.dataset.id;
      S.gearDraft = '';
      S.focusGear = !!S.gearOpen;
      render();
      return;
    }
    if (act === 'gear-add') {
      const inp = document.getElementById('gearName');
      addGear(t.dataset.id, inp ? inp.value : S.gearDraft);
      return;
    }
    if (act === 'gear-on') { attachGear(t.dataset.id, t.dataset.gear); return; }
    if (act === 'gear-off') { detachGear(t.dataset.id, t.dataset.gear); return; }
    if (act === 'save-gear') { S.gearOpen = null; save(); flash('SPEL OPGESLAGEN'); return; }
    if (act === 'advice-toggle') { S.adviceOpen = !S.adviceOpen; render(); return; }
    if (act === 'advice-apply') { applyAdvice(); return; }
    if (act === 'game-move') {
      const dir = Number(t.dataset.dir);
      const i = S.games.findIndex(function (g) { return g.id === t.dataset.id; });
      const j = i + dir;
      if (i >= 0 && j >= 0 && j < S.games.length) {
        const tmp = S.games[i];
        S.games[i] = S.games[j];
        S.games[j] = tmp;
        S.games.forEach(function (g, n) { g.order = n; });
        save();
        render();
      }
      return;
    }
    if (act === 'pick-game') { S.activeGameId = t.dataset.id; S.view = 'action'; S.find = ''; save(); render(); return; }
    if (act === 'open-found') { openFound(); return; }
    if (act === 'open-score') { openScore(t.dataset.id); return; }
    if (act === 'order-tap') { tapOrder(t.dataset.id); return; }
    if (act === 'score-delta') {
      if (S.arm === 'score-check') S.arm = null;
      S.score.points = (Number(S.score.points) || 0) + Number(t.dataset.delta);
      render();
      return;
    }
    if (act === 'time-step') {
      if (S.arm === 'score-check') S.arm = null;
      const field = t.dataset.field;
      if (field === 'min') S.score.min = clamp((Number(S.score.min) || 0) + Number(t.dataset.delta), 0, 600);
      else S.score.sec = clamp((Number(S.score.sec) || 0) + Number(t.dataset.delta), 0, 59);
      render();
      return;
    }
    if (act === 'save-score') { saveScore('done'); return; }
    if (act === 'save-absent') { saveScore('absent'); return; }
    if (act === 'save-clear') { saveScore('clear'); return; }
    if (act === 'take-time') { takeTime(); return; }
    if (act === 'watch-toggle') { toggleWatch(t.dataset.id); return; }
    if (act === 'watch-reset') { resetWatch(t.dataset.id); return; }
    if (act === 'pick-count') { commitGroups(Number(t.dataset.n)); return; }
    if (act === 'ask-split') { S.askSplit = !S.askSplit; render(); return; }
    if (act === 'fullscreen') { toggleFullscreen(); return; }
    if (act === 'focus-group') { S.focusGroupId = t.dataset.id; render(); return; }
    if (act === 'set-parallel') {
      const game = activeGame();
      if (!game) return;
      game.parallel = clamp(Number(t.dataset.n), 1, 12);
      game.wave = 0;
      save();
      render();
      return;
    }
    if (act === 'clear-parallel') {
      const game = activeGame();
      if (!game) return;
      if (orderOf(game).length || S.results.some(function (r) { return r.gameId === game.id; })) {
        flash('DIT SPEL IS AL BEGONNEN', true);
        return;
      }
      game.parallel = null;
      game.wave = 0;
      save();
      render();
      return;
    }
    if (act === 'set-heat') {
      const game = activeGame();
      if (!game) return;
      const w = ensureWatch(game.id);
      const started = orderOf(game).length || S.results.some(function (r) { return r.gameId === game.id; });
      if (started && w.heatAsked) { flash('DIT SPEL IS AL BEGONNEN', true); return; }
      w.heatAll = t.dataset.mode === 'all';
      w.heatAsked = true;
      w.heatId = null;
      save();
      render();
      return;
    }
    if (act === 'heat-next') { heatNext(); return; }
    if (act === 'heat-pick') { heatPick(t.dataset.id || ''); return; }
    if (act === 'wave-next') { waveNext(); return; }
    if (act === 'wave-wait') { flash('NOG NIET AAN DE BEURT', true); return; }
    if (act === 'undo') { undo(); return; }
    if (act === 'ask-out') { openOutSheet(t.dataset.what || 'player', t.dataset.id); return; }
    if (act === 'stand-open') {
      S.modal = { kind: 'breakdown', what: t.dataset.what === 'group' ? 'group' : 'solo', id: t.dataset.id };
      render();
      return;
    }
    if (act === 'confirm-out') {
      const sheet = S.modal;
      if (sheet && sheet.kind === 'out') setOut(sheet.what, sheet.id, sheet.makeOut);
      return;
    }
    if (act === 'skip-game') { skipGame(true); return; }
    if (act === 'unskip-game') { skipGame(false); return; }
    if (act === 'start-player-rename') {
      const p = playerById(t.dataset.id);
      S.renamePlayerId = t.dataset.id;
      S.renamePlayerText = p ? p.name : '';
      render();
      const inp = document.getElementById('playerRename');
      if (inp) inp.focus();
      return;
    }
    if (act === 'save-player-rename') { savePlayerRename(t.dataset.id); return; }
    if (act === 'unlock') { S.unlocked = true; S.modal = null; S.view = t.dataset.view || 'settings'; render(); return; }
    if (act === 'copy-backup') { copyBackup(); return; }
    if (act === 'save-file') { downloadBackup(); return; }
    if (act === 'pick-file') {
      const inp = document.getElementById('backupFile');
      if (inp) inp.click();
      return;
    }
    if (act === 'ask-restore') { S.restoreText = ''; S.modal = { kind: 'restore' }; render(); return; }
    if (act === 'do-restore') { doRestore(); return; }
  }
  function onBackdrop(e) {
    const back = e.target.closest('.modal-back');
    if (!back || e.target !== back) return;
    if (S.modal && S.modal.kind === 'backup-text') { S.modal = null; render(); return; }
    if (S.modal && (S.modal.kind === 'score' || S.modal.kind === 'confirm-del' || S.modal.kind === 'drop-groups' || S.modal.kind === 'restore' || S.modal.kind === 'unlock' || S.modal.kind === 'out' || S.modal.kind === 'breakdown')) {
      S.modal = null;
      S.score = null;
      render();
    }
  }
  async function copyBackup() {
    const text = JSON.stringify(blob(), null, 2);
    try {
      if (!navigator.clipboard || !window.isSecureContext) throw new Error('geen klembord');
      await navigator.clipboard.writeText(text);
      flash('BACKUP GEKOPIEERD');
    } catch (e) {
      S.modal = { kind: 'backup-text', text: text };
      render();
      const area = document.querySelector('.sheet textarea');
      if (area) { area.focus(); area.select(); }
    }
  }
  function downloadBackup() {
    const text = JSON.stringify(blob(), null, 2);
    const file = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'hvr-halloween-backup.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    flash('BESTAND KLAAR. KIJK BIJ DOWNLOADS.');
  }
  function doRestore() {
    const raw = S.restoreText || '';
    try {
      const obj = JSON.parse(raw);
      if (!obj || obj.version !== 1 || !Array.isArray(obj.players) || !Array.isArray(obj.groups) || !Array.isArray(obj.games)) throw new Error('vorm');
      applyData(obj);
      ensureGear();
      S.modal = null;
      S.view = bootView();
      save();
      flash('BACKUP TERUGGEZET');
    } catch (e) {
      flash('DIT IS GEEN GOEDE BACKUP', true);
    }
  }

  function paintClocks() {
    document.querySelectorAll('[data-clock]').forEach(function (el) {
      const id = el.getAttribute('data-clock');
      const ms = watchMs(S.watches[id]);
      el.innerHTML = formatWatch(ms);
      const game = gameById(id);
      const card = el.closest('.watch');
      if (!card || !game || !game.signalSec) return;
      const call = card.querySelector('[data-call]');
      if (ms >= game.signalSec * 1000) {
        if (!card.classList.contains('timeup')) card.classList.add('timeup', 'pulse');
        if (call) call.textContent = 'Tijd om';
      } else {
        card.classList.remove('timeup', 'pulse');
        if (call) call.textContent = callText(ms, game.signalSec);
      }
    });
  }
  function tick() {
    paintClocks();
    if (drag) return;
    if (S.arm && Date.now() > S.armUntil) { S.arm = null; if (!S.modal && !drag) render(); }
  }
  function syncTimer() {
    const running = Object.keys(S.watches).some(function (id) { return S.watches[id] && S.watches[id].running; });
    if (running && document.visibilityState === 'visible') {
      if (!timer) timer = setInterval(tick, 100);
    } else if (timer) {
      clearInterval(timer);
      timer = null;
    }
  }
  let wantWake = false;
  let wakeTimer = 0;
  function keepAwake() {
    wantWake = true;
    if (!navigator.wakeLock || document.visibilityState !== 'visible' || wake) return;
    navigator.wakeLock.request('screen').then(function (s) {
      wake = s;
      s.addEventListener('release', function () {
        if (wake === s) wake = null;
        if (!wantWake || document.visibilityState !== 'visible') return;
        clearTimeout(wakeTimer);
        wakeTimer = setTimeout(keepAwake, 1500);
      });
    }).catch(function () {});
  }
  function showGhost(name, x, y) {
    const g = document.getElementById('ghost');
    const vv = window.visualViewport;
    g.hidden = false;
    g.textContent = name;
    g.style.left = (x + (vv ? vv.offsetLeft : 0)) + 'px';
    g.style.top = (y + (vv ? vv.offsetTop : 0)) + 'px';
  }
  function hideGhost() {
    const g = document.getElementById('ghost');
    g.hidden = true;
  }
  function markOver(x, y) {
    const el = document.elementFromPoint(x, y);
    const col = el && el.closest('[data-drop]');
    document.querySelectorAll('[data-drop]').forEach(function (c) { c.classList.toggle('over', c === col); });
    return col;
  }

  document.addEventListener('fullscreenchange', render);
  document.addEventListener('webkitfullscreenchange', render);
  document.addEventListener('click', function (e) {
    if (suppressClick) { suppressClick = false; e.preventDefault(); return; }
    onBackdrop(e);
    onClick(e);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'playerName') S.draftName = e.target.value;
    if (e.target.id === 'playerList') S.listText = e.target.value;
    if (e.target.id === 'playerRename') S.renamePlayerText = e.target.value;
    if (e.target.id === 'gameName' && S.gameForm) S.gameForm.name = e.target.value;
    if (e.target.id === 'renameInput') S.renameText = e.target.value;
    if (e.target.id === 'restoreBox') S.restoreText = e.target.value;
    if (e.target.id === 'findName') {
      S.find = e.target.value;
      applyFindFilter();
    }
    if (e.target.id === 'scorePoints' && S.score) {
      if (S.arm === 'score-check') S.arm = null;
      const raw = e.target.value.trim();
      const num = document.querySelector('.score-num');
      if (raw === '' || raw === '-' || raw === '+') { if (num) num.textContent = raw || '0'; return; }
      if (!Number.isFinite(Number(raw))) return;
      S.score.points = Number(raw);
      if (num) num.textContent = String(S.score.points);
    }
    if (e.target.id === 'scoreMin' && S.score) { if (S.arm === 'score-check') S.arm = null; S.score.min = clamp(e.target.value, 0, 600); }
    if (e.target.id === 'scoreSec' && S.score) { if (S.arm === 'score-check') S.arm = null; S.score.sec = clamp(e.target.value, 0, 59); }
    if (e.target.id === 'gearName') S.gearDraft = e.target.value;
  });
  function openFound() {
    const game = activeGame();
    if (!game) return;
    const q = (S.find || '').trim().toLowerCase();
    const parts = peopleNow(game).filter(function (p) {
      return !q || (p.name + ' ' + (p.sub || '')).toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) { return a.name.localeCompare(b.name, 'nl'); });
    const order = orderOf(game);
    const next = parts.find(function (p) { return order.indexOf(p.id) < 0 && !resultOf(game.id, p.id); })
      || parts.find(function (p) { return order.indexOf(p.id) < 0; })
      || parts.find(function (p) { return !resultOf(game.id, p.id); })
      || parts[0];
    if (!next) return;
    if (game.mode === 'elim' || game.mode === 'finish') tapOrder(next.id);
    else openScore(next.id);
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'playerName') { e.preventDefault(); addPlayer(); return; }
    if (e.key === 'Enter' && e.target.id === 'playerRename') { e.preventDefault(); savePlayerRename(S.renamePlayerId); return; }
    if (e.key === 'Enter' && e.target.id === 'gearName') { e.preventDefault(); addGear(S.gearOpen, e.target.value); return; }
    if (e.key === 'Enter' && e.target.id === 'gameName') { e.preventDefault(); saveGameForm(); }
    if (e.key === 'Enter' && e.target.id === 'findName') { e.preventDefault(); openFound(); return; }
    if (e.key === 'Enter' && S.modal && S.modal.kind === 'score' && (e.target.id === 'scorePoints' || e.target.id === 'scoreMin' || e.target.id === 'scoreSec')) { e.preventDefault(); saveScore('done'); return; }
    if (e.key === 'Escape') {
      if (S.modal) { S.modal = null; S.score = null; render(); return; }
      if (S.find) { S.find = ''; render(); }
      return;
    }
    if (e.key === 'Enter' && e.target.id === 'renameInput') {
      e.preventDefault();
      const btn = document.querySelector('[data-act="save-rename"]');
      if (btn) btn.click();
    }
  });
  document.addEventListener('contextmenu', function (e) {
    if (!e.target.closest('input, textarea')) e.preventDefault();
  });
  let hold = null;
  let holdTimer = 0;
  let holdFired = false;
  function clearHold() {
    clearTimeout(holdTimer);
    holdTimer = 0;
    hold = null;
  }
  document.addEventListener('pointerdown', function (e) {
    suppressClick = false;
    keepAwake();
    clearHold();
    const held = e.target.closest('[data-hold]');
    if (held && !S.modal && !(e.button && e.button !== 0)) {
      hold = { id: held.dataset.id, what: held.dataset.hold || 'player', x: e.clientX, y: e.clientY, pointerId: e.pointerId };
      holdTimer = setTimeout(function () {
        if (!hold) return;
        const h = hold;
        hold = null;
        holdFired = true;
        suppressClick = true;
        drag = null;
        document.body.classList.remove('dragging');
        hideGhost();
        openOutSheet(h.what, h.id);
      }, 650);
    }
    const chip = e.target.closest('.chip');
    if (!chip || S.view !== 'groups' || S.modal) return;
    if (e.button && e.button !== 0) return;
    const p = playerById(chip.dataset.id);
    drag = { id: chip.dataset.id, name: p ? p.name : '', x: e.clientX, y: e.clientY, moved: false, pointerId: e.pointerId, pointerType: e.pointerType || 'mouse' };
    if (drag.pointerType === 'mouse') {
      try { chip.setPointerCapture(e.pointerId); } catch (err) {}
    }
  });
  document.addEventListener('pointermove', function (e) {
    if (hold && e.pointerId === hold.pointerId && Math.hypot(e.clientX - hold.x, e.clientY - hold.y) > 14) clearHold();
    if (!drag || e.pointerId !== drag.pointerId || drag.pointerType !== 'mouse') return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
    drag.moved = true;
    document.body.classList.add('dragging');
    showGhost(drag.name, e.clientX, e.clientY);
    markOver(e.clientX, e.clientY);
  });
  document.addEventListener('pointerup', function (e) {
    const fired = holdFired;
    clearHold();
    if (fired) {
      holdFired = false;
      setTimeout(function () { suppressClick = false; }, 0);
    }
    if (!drag || e.pointerId !== drag.pointerId) return;
    const d = drag;
    drag = null;
    document.body.classList.remove('dragging');
    hideGhost();
    if (fired) return;
    if (d.moved && d.pointerType === 'mouse') {
      suppressClick = true;
      const col = markOver(e.clientX, e.clientY);
      if (col) movePlayer(d.id, col.getAttribute('data-drop'));
      else render();
    } else if (!d.moved) {
      suppressClick = true;
      S.selectedPlayerId = S.selectedPlayerId === d.id ? null : d.id;
      render();
    }
  });
  document.addEventListener('pointercancel', function () {
    clearHold();
    drag = null;
    document.body.classList.remove('dragging');
    hideGhost();
  });
  document.addEventListener('visibilitychange', function () {
    syncTimer();
    if (document.visibilityState === 'visible') {
      if (wantWake) keepAwake();
      paintClocks();
    }
  });
  function revealField(el) {
    const sc = el.closest('.sheet, .play-main, .play-side, .scroll');
    if (!sc) return;
    const er = el.getBoundingClientRect();
    const sr = sc.getBoundingClientRect();
    if (er.top >= sr.top + 8 && er.bottom <= sr.bottom - 8) return;
    sc.scrollTop += er.top - sr.top - Math.max(12, (sr.height - er.height) / 3);
  }
  document.addEventListener('focusin', function (e) {
    const el = e.target;
    if (!el || !el.closest || !el.closest('input, textarea')) return;
    setTimeout(function () { if (document.contains(el)) revealField(el); }, 60);
    setTimeout(function () { if (document.contains(el)) revealField(el); }, 360);
  });
  document.addEventListener('change', function (e) {
    if (e.target.id !== 'backupFile') return;
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      S.restoreText = String(reader.result || '');
      S.modal = { kind: 'restore' };
      render();
    };
    reader.onerror = function () { flash('BESTAND NIET GELEZEN', true); };
    reader.readAsText(file);
  });
  document.addEventListener('touchstart', function () {}, { passive: true });
  window.addEventListener('pagehide', function () { save(); });
  window.addEventListener('pageshow', function () {
    syncTimer();
    paintClocks();
    if (wantWake) keepAwake();
  });
  window.addEventListener('storage', function (e) {
    if (!e || e.key !== KEY || !e.newValue || S.holdSave || drag) return;
    const obj = readStored(e.newValue);
    if (!obj) return;
    applyData(obj);
    render();
    syncTimer();
  });
  function trapBack() {
    try {
      history.replaceState({ hvr: 1 }, '', location.href);
      history.pushState({ hvr: 2 }, '', location.href);
      window.addEventListener('popstate', function () {
        history.pushState({ hvr: 2 }, '', location.href);
      });
    } catch (e) {}
  }

  function selfTest() {
    function eq(a, b, msg) { if (a !== b) throw new Error(msg + ': ' + a + ' != ' + b); }
    const hi = placeRows([{ name: 'B', score: 10 }, { name: 'A', score: 10 }, { name: 'C', score: 8 }], 'high');
    eq(hi.map(function (r) { return r.rank; }).join(','), '1,1,3', 'rank high');
    eq(hi.map(function (r) { return r.medal; }).join(','), '3,3,1', 'medal high');
    eq(hi.map(function (r) { return r.name; }).join(','), 'A,B,C', 'tie alpha');
    const lo = placeRows([{ name: 'A', score: 90 }, { name: 'C', score: 70 }, { name: 'B', score: 70 }], 'low');
    eq(lo.map(function (r) { return r.name; }).join(','), 'B,C,A', 'time order');
    eq(lo.map(function (r) { return r.medal; }).join(','), '3,3,1', 'medal low');
    const groups = [{ playerIds: [] }, { playerIds: [] }, { playerIds: [] }, { playerIds: [] }, { playerIds: [] }];
    const ids = [];
    for (let i = 0; i < 35; i++) ids.push('p' + i);
    ids.forEach(function (id, i) { groups[i % groups.length].playerIds.push(id); });
    eq(groups.map(function (g) { return g.playerIds.length; }).join(','), '7,7,7,7,7', '35/5');
    const g2 = [{ playerIds: [] }, { playerIds: [] }, { playerIds: [] }, { playerIds: [] }, { playerIds: [] }];
    const ids2 = [];
    for (let i = 0; i < 32; i++) ids2.push('q' + i);
    ids2.forEach(function (id, i) { g2[i % g2.length].playerIds.push(id); });
    eq(g2.map(function (g) { return g.playerIds.length; }).join(','), '7,7,6,6,6', '32/5');
    const adv = orderAdvice();
    eq(!!adv, true, 'advice');
    eq(adv.games[0].participantType, 'solo', 'advice start');
    eq(adv.games[adv.games.length - 1].id, 'koekoek', 'advice end');
    eq(adv.notes.length > 0, true, 'advice notes');
    eq(groupIcon('Heksen'), '🧙', 'icon heks');
    eq(groupIcon('Spoken'), '👻', 'icon spook');
    eq(groupIcon('Vleermuizen'), '🦇', 'icon vleermuis');
    eq(shortName('Vleermuizen', 5), 'Vleermuizen', 'naam 5');
    eq(shortName('Zwarte katten', 5), 'Zwarte katten', 'naam katten');
    eq(shortName('Pompoenen', 6), 'Pompoenen', 'naam 6');
    eq(shortName('Annemarietje', 7), 'Annemarie…', 'naam lang');
    eq(cleanNameLine('Leonie (5,00)'), 'Leonie', 'bedrag weg');
    eq(cleanNameLine('Hannah (5 euro)'), 'Hannah', 'euro weg');
    eq(namesFromList('Martijn M\nMartijn F\nMartijn M').join('|'), 'Martijn M|Martijn F', 'dubbel in lijst');
    eq(ROSTER.length, 34, 'lijst 34');
    eq(readStored('{'), null, 'kapotte tekst');
    eq(readStored('[]'), null, 'geen lijst');
    eq(!!readStored('{"players":[]}'), true, 'goede tekst');
    eq(parallelChoices(6).map(function (o) { return o.n; }).join(','), '1,2,3,6', 'parallel 6');
    eq(parallelChoices(5).map(function (o) { return o.n; }).join(','), '1,2,3,5', 'parallel 5');
    eq(suggestedParallel({ id: 'mat', hint: 'Twee matten.', name: 'Mat' }, 6), 2, 'twee matten');
    eq(suggestedParallel({ id: 'pong', hint: 'Elk team alleen.', name: 'Pong' }, 5), 1, 'alleen');
    const probe = S.players[0];
    if (probe) {
      const wasOut = !!probe.out;
      probe.out = true;
      const solo = S.games.filter(function (g) { return g.participantType === 'solo'; })[0];
      if (solo) eq(roster(solo).some(function (p) { return p.id === probe.id; }), false, 'out leaves roster');
      probe.out = wasOut;
    }
    eq(gameRanking({ id: 'x', skipped: true, participantType: 'solo', mode: 'points' }).length, 0, 'skipped game gives no medals');
    const keepResults = S.results.slice();
    const keepSkip = S.games.map(function (g) { return !!g.skipped; });
    try {
      const solo = S.games.filter(function (g) { return g.participantType === 'solo' && g.mode === 'points'; })[0];
      const people = solo ? roster(solo) : [];
      if (solo && people.length >= 2) {
        people.forEach(function (p, i) {
          S.results.push({ id: 'stand-test-' + i, gameId: solo.id, participantId: p.id, status: 'done', points: i === 0 ? 12 : 1, timeSec: null });
        });
        const winner = overallAll('solo').find(function (r) { return r.id === people[0].id; });
        eq(winner.pts, 3, 'solo board gives 3 for first');
        const second = overallAll('solo').find(function (r) { return r.id === people[1].id; });
        eq(second.pts, 2, 'solo board gives 2 for second');
        solo.skipped = true;
        eq(overallAll('solo').find(function (r) { return r.id === people[0].id; }).pts, 0, 'skipped solo game leaves the board');
        solo.skipped = false;
      }
      const grp = S.games.filter(function (g) { return g.participantType === 'group' && g.mode === 'points'; })[0];
      const teams = grp ? roster(grp) : [];
      if (grp && teams.length >= 2) {
        teams.forEach(function (p, i) {
          S.results.push({ id: 'stand-gtest-' + i, gameId: grp.id, participantId: p.id, status: 'done', points: i === 0 ? 8 : 2, timeSec: null });
        });
        eq(overallAll('group').find(function (r) { return r.id === teams[0].id; }).pts, 3, 'group board gives 3 for first');
        eq(overallAll('solo').some(function (r) { return r.id === teams[0].id; }), false, 'group points stay off the solo board');
      }
    } finally {
      S.results = keepResults;
      S.games.forEach(function (g, i) { g.skipped = keepSkip[i]; });
    }
    const before = S.undos.length;
    pushUndo({ kind: 'rename', what: 'player', id: 'nobody', prev: 'x', label: 'test' });
    eq(S.undos.length, before + 1, 'undo stack');
    S.undos.pop();
    return 'ok';
  }
  window.capyTest = selfTest;

  load();
  seedProgram();
  ensureGear();
  S.view = bootView();
  if (!S.activeGameId && S.games[0]) S.activeGameId = S.games[0].id;
  render();
  syncTimer();
  trapBack();
  if ('serviceWorker' in navigator) {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.update();
    }).catch(function () {});
  }
})();
</script>
</body>
